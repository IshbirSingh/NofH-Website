<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery — Notes of Happiness</title>
<meta name="description" content="Photos from Notes of Happiness performances across Phoenix, Arizona." />
<link rel="icon" href="images/logos/NofH%20Logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css" />
</head>
<body data-page="gallery">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Gallery</p>
      <h1>Moments in Music</h1>
      <p class="lede">A look back at the performances, faces, and communities that make this mission possible.</p>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="gallery-grid" id="galleryGrid"></div>
      <div class="blog-empty" id="galleryEmpty" style="display:none;">
        <p>Photos are on their way &mdash; in the meantime, see our latest moments on <a class="btn-ghost" href="https://www.instagram.com/notes_of_happiness_az/" target="_blank" rel="noopener">Instagram</a>.</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous image">&#8249;</button>
  <img id="lightboxImg" src="" alt="" />
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next image">&#8250;</button>
</div>

<script src="scripts/gallery-images.js"></script>
<script src="scripts/gallery.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
